name: PHP-CS-Fixer

on:
  pull_request:
  push:

jobs:
  fix:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'

      - name: Install PHP-CS-Fixer
        run: |
          wget https://github.com/PHP-CS-Fixer/PHP-CS-Fixer/releases/download/v3.64.0/php-cs-fixer.phar -O /usr/local/bin/php-cs-fixer
          chmod +x /usr/local/bin/php-cs-fixer

      - name: Run PHP-CS-Fixer
        run: php-cs-fixer fix --allow-risky=yes --quiet

      - name: Commit and push changes (skip if no changes)
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'github-actions@github.com'
          git add .

          if git diff --cached --quiet; then
            echo "No changes to commit, skipping."
            exit 0
          fi

          git commit -m "Apply PHP-CS-Fixer changes"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:${{ github.ref }}
